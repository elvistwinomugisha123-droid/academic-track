name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "rebuild/**"
      - "chore/**"
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Isolated Supabase security integration tests
        env:
          TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$TEST_SUPABASE_URL" ] && [ -z "$TEST_SUPABASE_PUBLISHABLE_KEY" ] && [ -z "$TEST_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Isolated Supabase security integration tests not run: TEST Supabase project is not configured."
            exit 0
          fi
          if [ -z "$TEST_SUPABASE_URL" ] || [ -z "$TEST_SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$TEST_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "TEST Supabase configuration is incomplete; refusing to skip security integration tests."
            exit 1
          fi
          npm run test:security:integration

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e
