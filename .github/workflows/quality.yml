name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - "rebuild/**"
      - "chore/**"
      - "feat/**"
      - "fix/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Every application/fixture connection in this job targets TEST, never production.
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      ATE_ALLOW_TEST_SYNTHETIC_ASSESSMENTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Verify isolated TEST configuration
        run: |
          node <<'NODE'
          const ref = "lwbkxhimqlfuzzxilaga";
          for (const name of ["TEST_SUPABASE_URL", "TEST_SUPABASE_PUBLISHABLE_KEY", "TEST_SUPABASE_SERVICE_ROLE_KEY", "TEST_DATABASE_URL"]) {
            if (!process.env[name]) throw new Error("Missing GitHub Actions secret: " + name + ". Full authenticated validation cannot run.");
          }
          const api = new URL(process.env.TEST_SUPABASE_URL);
          const db = new URL(process.env.TEST_DATABASE_URL);
          const direct = db.hostname === "db." + ref + ".supabase.co";
          const pooler = db.hostname.endsWith(".pooler.supabase.com") && decodeURIComponent(db.username) === "postgres." + ref;
          if (api.hostname !== ref + ".supabase.co" || !["postgres:", "postgresql:"].includes(db.protocol) || !(direct || pooler)) {
            throw new Error("Refusing validation outside the isolated ATE TEST project.");
          }
          NODE

      - name: Create isolated assessment fixture
        env:
          TEST_ASSESSMENT_FIXTURE: "1"
        # The fixture script prints temporary passwords; never put those in CI logs.
        run: npx tsx scripts/assessment-test-fixture.ts > /dev/null

      - name: Isolated Supabase security integration tests
        env:
          TEST_ASSESSMENT_FIXTURE: "1"
        run: npm run test:security:integration

      - name: Create isolated product fixture
        run: npx tsx scripts/test-product-fixture.ts > /dev/null

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report/
            test-results/
            !playwright-report/**/*.zip
            !test-results/**/*.zip
            !playwright-report/**/*storage-state*.json
            !test-results/**/*storage-state*.json
            !playwright-report/**/auth-*.json
            !test-results/**/auth-*.json
