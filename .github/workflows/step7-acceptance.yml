name: STEP 7 Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step7-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Isolated teacher vertical slice
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate isolated TEST configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEST_SUPABASE_URL"
          test -n "$TEST_SUPABASE_PUBLISHABLE_KEY"
          test -n "$TEST_SUPABASE_SERVICE_ROLE_KEY"
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
          test -n "$DATABASE_URL"
          node -e 'const url = process.env.TEST_SUPABASE_URL ?? ""; const database = process.env.DATABASE_URL ?? ""; if (!url.includes("lwbkxhimqlfuzzxilaga") || !database.includes("lwbkxhimqlfuzzxilaga")) process.exit(1)'

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Deterministic tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Live security and integration tests
        run: npm run test:security:integration

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Authenticated Step 7 browser acceptance
        run: npm run test:e2e:step7

      - name: Upload Step 7 screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step7-acceptance-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            output/playwright/
            test-results/
            playwright-report/
